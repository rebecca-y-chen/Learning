<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026雙北公車友善月｜線上美術館</title>

  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  :root {
    --cream: #fffaf3;
    --cream-2: #fff1d8;
    --ink: #2f3345;
    --pink: #f26f68;
    --pink-soft: #ffe0dc;
    --yellow: #ffd65a;
    --yellow-soft: #fff1b7;
    --green: #79d3b9;
    --green-soft: #dff6ee;
    --blue: #9ed8f5;
    --blue-soft: #e2f4fd;
    --purple-soft: #eee7ff;
    --white: #ffffff;

    --shadow: 5px 5px 0 var(--ink);

    --radius-lg: 30px;
    --radius-md: 20px;
    --radius-sm: 14px;
  }

  body {
    font-family:
      "Noto Sans TC",
      "PingFang TC",
      "Microsoft JhengHei",
      sans-serif;

    color: var(--ink);
    line-height: 1.7;
    overflow-x: hidden;

    background:
      radial-gradient(
        circle at 12px 12px,
        rgba(47, 51, 69, .055) 2px,
        transparent 2.5px
      ) 0 0 / 34px 34px,
      var(--cream);
  }

  button {
    font: inherit;
  }

  img {
    display: block;
    max-width: 100%;
  }

  /* --------------------
     MAIN BANNER
  -------------------- */

  .main-banner {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    overflow: hidden;
  }

  .main-banner img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* --------------------
     MAIN
  -------------------- */

  main {
    width: min(1240px, calc(100% - 34px));
    margin: 0 auto;
    padding: 62px 0 90px;
  }

  /* --------------------
     INTRO
  -------------------- */

  .intro-box {
    position: relative;
    overflow: hidden;

    margin-bottom: 38px;
    padding: 34px 38px;

    background: rgba(255, 255, 255, .9);
    border: 2px solid var(--ink);
    border-radius: 32px;
    box-shadow: var(--shadow);
  }

  .intro-box h2 {
    margin-bottom: 10px;

    color: var(--pink);
    font-size: clamp(28px, 4vw, 42px);
  }

  .intro-box::after {
    content: "●  ▲  ✦";

    position: absolute;
    right: 28px;
    bottom: 17px;

    color: var(--green);
    font-size: 20px;
    letter-spacing: 8px;

    opacity: .42;
    transform: rotate(-7deg);
  }

  /* --------------------
     FILTERS
  -------------------- */

  .filters {
    position: sticky;
    top: 12px;
    z-index: 30;

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;

    margin: 34px 0 64px;
    padding: 18px 20px 20px;

    background: rgba(255, 250, 243, .94);
    border: 2px solid var(--ink);
    border-radius: 26px;
    box-shadow: 4px 4px 0 rgba(47, 51, 69, .18);

    backdrop-filter: blur(14px);
  }

  .filter-label {
    width: 100%;
    margin-top: 6px;

    color: #62687c;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: .08em;
  }

  .filter-btn {
    cursor: pointer;

    padding: 9px 15px;

    color: var(--ink);
    font-weight: 800;

    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);

    transition:
      transform .15s ease,
      box-shadow .15s ease,
      background .15s ease;
  }

  .filter-btn:hover {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  .filter-btn.active {
    background: var(--yellow);
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }

  /* --------------------
     EXHIBITION SECTION
  -------------------- */

  .section {
    position: relative;

    margin-top: 78px;
    padding: 32px 30px 38px;

    border-radius: 36px;
  }

  #specialSection {
    background:
      linear-gradient(
        180deg,
        rgba(255, 241, 183, .72),
        rgba(255, 255, 255, .46)
      );
  }

  #artistSection {
    background:
      linear-gradient(
        180deg,
        rgba(226, 244, 253, .82),
        rgba(255, 255, 255, .48)
      );
  }

  .section::before {
    content: "";

    position: absolute;
    inset: 12px;

    border: 2px dashed rgba(47, 51, 69, .14);
    border-radius: 27px;

    pointer-events: none;
  }

  .section-heading {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 18px;

    margin-bottom: 24px;
    padding: 0 4px 16px;

    border-bottom: 3px solid var(--ink);
  }

  .section-heading h2 {
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.2;
    letter-spacing: -.02em;
  }

  .section-heading .en {
    display: block;
    margin-top: 4px;

    color: #72788a;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
  }

  .count-badge {
    white-space: nowrap;

    padding: 8px 14px;

    font-weight: 900;

    background: var(--green);
    border: 2px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  /* --------------------
     GALLERY
  -------------------- */

  .gallery-grid {
    position: relative;
    z-index: 2;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 28px 22px;
  }

  .gallery-grid.featured {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .art-card {
    position: relative;

    cursor: pointer;

    padding: 11px;

    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 22px;
    box-shadow: 5px 5px 0 rgba(47, 51, 69, .9);

    transform-origin: center bottom;

    transition:
      transform .18s ease,
      box-shadow .18s ease;
  }

  .art-card:nth-child(3n + 1) {
    transform: rotate(-.35deg);
  }

  .art-card:nth-child(3n + 2) {
    transform: rotate(.28deg);
  }

  .art-card:nth-child(3n) {
    transform: rotate(-.12deg);
  }

  .art-card:hover {
    transform: translateY(-7px) rotate(0deg);
    box-shadow: 7px 10px 0 var(--ink);
  }

  .art-card:focus-visible {
    outline: 4px solid var(--blue);
    outline-offset: 4px;
  }

  .art-image {
    position: relative;

    display: grid;
    place-items: center;

    aspect-ratio: 4 / 3;

    overflow: hidden;

    background: #fffdf8;
    border: 2px solid var(--ink);
    border-radius: 14px;
  }

  .art-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #fff;
  }

  .placeholder {
    padding: 20px;

    color: #81796f;
    font-weight: 900;
    text-align: center;
  }

  .placeholder span {
    display: block;

    margin-bottom: 5px;

    font-size: 34px;
  }

  .award-tag {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 2;

    display: inline-block;

    padding: 6px 10px;

    font-size: 12px;
    font-weight: 900;
    line-height: 1;

    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
  }

  #artistSection .award-tag {
    background: var(--blue-soft);
  }

  .art-meta {
    padding: 16px 7px 7px;
  }

  .art-meta .where {
    margin-bottom: 5px;

    color: #6d6d6d;
    font-size: 13px;
    font-weight: 800;
  }

  .art-meta h3 {
    margin-bottom: 6px;

    font-size: 19px;
    line-height: 1.35;
  }

  .art-meta .name {
    font-weight: 900;
  }

  .art-meta .school {
    color: #696969;
    font-size: 14px;
  }

  .empty-state {
    padding: 50px 20px;

    color: #777;
    text-align: center;

    background: rgba(255, 255, 255, .55);
    border: 2px dashed #999;
    border-radius: 20px;
  }

  /* --------------------
     FOOTER
  -------------------- */

  footer {
    margin-top: 0;
    padding: 42px 20px;

    color: var(--white);
    text-align: center;
    line-height: 1.9;

    background:
      radial-gradient(
        circle at 10px 10px,
        rgba(255, 255, 255, .08) 1.5px,
        transparent 2px
      ) 0 0 / 26px 26px,
      var(--ink);
  }

  footer strong {
    font-size: 18px;
  }

  /* =========================================================
     LIGHTBOX
     ========================================================= */

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 999;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 14px;

    background: rgba(20, 22, 30, .91);

    backdrop-filter: blur(12px);
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox-panel {
    position: relative;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;

    width: min(1500px, calc(100vw - 28px));
    height: min(94dvh, 980px);

    overflow: hidden;

    background: #171922;
    border-radius: 22px;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .45);
  }

  .lightbox-art {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 0;
    height: 100%;

    padding: 18px;

    overflow: hidden;

    background:
      radial-gradient(
        circle at 12px 12px,
        rgba(255, 255, 255, .035) 1.5px,
        transparent 2px
      ) 0 0 / 28px 28px,
      #171922;
  }

  .lightbox-art .art-image {
    width: 100%;
    height: 100%;
    max-width: none;

    aspect-ratio: auto;

    overflow: hidden;

    background: transparent;
    border: 0;
    border-radius: 8px;
  }

  .lightbox-art .art-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: transparent;
  }

  .lightbox-art .placeholder {
    display: grid;
    place-content: center;

    width: min(900px, 92%);
    aspect-ratio: 4 / 3;

    background: #fffaf3;
    border: 3px dashed rgba(47, 51, 69, .3);
    border-radius: 16px;
  }

  .lightbox-info {
    overflow-y: auto;

    padding: 74px 24px 26px;

    color: var(--ink);

    background: #fffaf3;
    border-left: 1px solid rgba(255, 255, 255, .08);
  }

  .lightbox-info .award {
    display: inline-block;

    margin-bottom: 16px;
    padding: 7px 11px;

    font-size: 13px;
    font-weight: 900;

    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 999px;
  }

  .lightbox-info h3 {
    margin-bottom: 16px;

    font-size: clamp(24px, 2.4vw, 34px);
    line-height: 1.25;
  }

  .lightbox-info dl {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 8px 12px;

    margin-top: 18px;

    font-size: 14px;
  }

  .lightbox-info dt {
    color: #777;
    font-weight: 800;
  }

  .lightbox-info dd {
    font-weight: 800;
  }

  .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 1005;

    width: 48px;
    height: 48px;

    cursor: pointer;

    color: var(--ink);
    font-size: 24px;
    font-weight: 900;
    line-height: 1;

    background: rgba(255, 255, 255, .94);
    border: 0;
    border-radius: 50%;
  }

  .lightbox-nav {
    display: flex;
    gap: 10px;

    margin-top: 28px;
  }

  .nav-btn {
    flex: 1;

    cursor: pointer;

    padding: 10px;

    font-size: 14px;
    font-weight: 900;

    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 2px 2px 0 var(--ink);
  }

  .nav-btn:hover {
    background: var(--green);
  }

  /* =========================================================
     TABLET
     ========================================================= */

  @media (max-width: 980px) {

    .gallery-grid,
    .gallery-grid.featured {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .lightbox-panel {
      width: calc(100vw - 18px);
      height: calc(100dvh - 18px);

      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) auto;

      border-radius: 16px;
    }

    .lightbox-art {
      padding: 10px 10px 4px;
    }

    .lightbox-info {
      max-height: 34vh;

      padding: 16px 18px 18px;

      border-top: 1px solid rgba(47, 51, 69, .18);
      border-left: 0;
    }

    .lightbox-info .award {
      margin-bottom: 8px;
      padding: 5px 9px;
    }

    .lightbox-info h3 {
      margin-bottom: 8px;

      font-size: 22px;
    }

    .lightbox-info dl {
      grid-template-columns: 56px 1fr 56px 1fr;
      gap: 5px 8px;

      margin-top: 10px;
    }

    .lightbox-nav {
      margin-top: 14px;
    }
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 700px) {

    main {
      width: min(100% - 20px, 1240px);
      padding-top: 34px;
    }

    .intro-box {
      padding: 24px 22px 44px;
    }

    .filters {
      top: 6px;

      margin-bottom: 46px;
      padding: 14px;

      border-radius: 22px;
    }

    .section {
      margin-top: 48px;
      padding: 24px 14px 28px;

      border-radius: 26px;
    }

    .gallery-grid,
    .gallery-grid.featured {
      grid-template-columns: 1fr;
    }

    .section-heading {
      flex-direction: column;
      align-items: flex-start;
    }

    .lightbox {
      padding: 0;
    }

    .lightbox-panel {
      width: 100vw;
      height: 100dvh;

      grid-template-rows: minmax(0, 1fr) auto;

      border-radius: 0;
    }

    .lightbox-art {
      padding: 54px 6px 4px;
    }

    .lightbox-info {
      max-height: 32vh;
      padding: 12px 14px 14px;
    }

    .lightbox-info dl {
      grid-template-columns: 54px 1fr;
    }

    .lightbox-nav {
      gap: 8px;
    }

    .close-btn {
      top: 12px;
      right: 12px;

      width: 44px;
      height: 44px;
    }
  }
</style>
</head>

    const filters = {
      award: "all",
      city: "all",
      group: "all"
    };

    const specialGallery = document.getElementById("specialGallery");
    const artistGallery = document.getElementById("artistGallery");
    const specialSection = document.getElementById("specialSection");
    const artistSection = document.getElementById("artistSection");

    const specialCount = document.getElementById("specialCount");
    const artistCount = document.getElementById("artistCount");

    function createImageHTML(artwork) {
      if (artwork.image) {
        return `
          <img
            src="${artwork.image}"
            alt="${artwork.title}"
            loading="lazy"
            onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;><span>🎨</span>作品圖片<br>COMING SOON</div>'"
          >
        `;
      }

      return `
        <div class="placeholder">
          <span>🎨</span>
          作品圖片<br>
          COMING SOON
        </div>
      `;
    }

    function createCard(artwork) {
      const card = document.createElement("article");

      card.className = "art-card";
      card.tabIndex = 0;

      card.innerHTML = `
        <span class="award-tag">
          ${artwork.award === "special" ? "特優獎" : "小藝術家獎"}
        </span>

        <div class="art-image">
          ${createImageHTML(artwork)}
        </div>

        <div class="art-meta">
          <div class="where">${artwork.city} ・ ${artwork.group}</div>

          <h3>${artwork.title}</h3>

          <div class="name">${artwork.name}</div>
          <div class="school">${artwork.school}</div>
        </div>
      `;

      card.addEventListener("click", () => openLightbox(artwork));

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openLightbox(artwork);
        }
      });

      return card;
    }

    function matchesFilters(artwork) {
      const awardOK =
        filters.award === "all" ||
        artwork.award === filters.award;

      const cityOK =
        filters.city === "all" ||
        artwork.city === filters.city;

      const groupOK =
        filters.group === "all" ||
        artwork.group === filters.group;

      return awardOK && cityOK && groupOK;
    }

    function renderGallery() {
      specialGallery.innerHTML = "";
      artistGallery.innerHTML = "";

      const filtered = artworks.filter(matchesFilters);

      const specialWorks =
        filtered.filter(item => item.award === "special");

      const artistWorks =
        filtered.filter(item => item.award === "artist");

      specialWorks.forEach(item => {
        specialGallery.appendChild(createCard(item));
      });

      artistWorks.forEach(item => {
        artistGallery.appendChild(createCard(item));
      });

      specialCount.textContent = `${specialWorks.length} 件作品`;
      artistCount.textContent = `${artistWorks.length} 件作品`;

      specialSection.style.display =
        specialWorks.length ? "block" : "none";

      artistSection.style.display =
        artistWorks.length ? "block" : "none";

      if (!filtered.length) {
        specialSection.style.display = "block";
        specialGallery.innerHTML =
          `<div class="empty-state">目前沒有符合這個篩選條件的作品。</div>`;
        specialCount.textContent = "0 件作品";
      }
    }


    /* FILTER */
    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {

        const type = button.dataset.filterType;
        const value = button.dataset.filterValue;

        filters[type] = value;

        document
          .querySelectorAll(`[data-filter-type="${type}"]`)
          .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderGallery();
      });
    });


    /*
      ==========================================================
      LIGHTBOX
      ==========================================================
    */

    const lightbox = document.getElementById("lightbox");
    const closeLightboxButton =
      document.getElementById("closeLightbox");

    const lightboxImage =
      document.getElementById("lightboxImage");

    const lightboxAward =
      document.getElementById("lightboxAward");

    const lightboxTitle =
      document.getElementById("lightboxTitle");

    const lightboxName =
      document.getElementById("lightboxName");

    const lightboxSchool =
      document.getElementById("lightboxSchool");

    const lightboxCity =
      document.getElementById("lightboxCity");

    const lightboxGroup =
      document.getElementById("lightboxGroup");

    let currentArtwork = null;

    function getVisibleArtworks() {
      return artworks.filter(matchesFilters);
    }

    function openLightbox(artwork) {
      currentArtwork = artwork;

      lightboxAward.textContent =
        artwork.awardName;

      lightboxTitle.textContent =
        artwork.title;

      lightboxName.textContent =
        artwork.name;

      lightboxSchool.textContent =
        artwork.school;

      lightboxCity.textContent =
        artwork.city;

      lightboxGroup.textContent =
        artwork.group;

      lightboxImage.innerHTML =
        createImageHTML(artwork);

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");

      document.body.style.overflow = "";
    }

    function moveArtwork(direction) {
      const visible = getVisibleArtworks();

      if (!visible.length || !currentArtwork) return;

      let index =
        visible.findIndex(item => item.id === currentArtwork.id);

      index += direction;

      if (index < 0) {
        index = visible.length - 1;
      }

      if (index >= visible.length) {
        index = 0;
      }

      openLightbox(visible[index]);
    }

    closeLightboxButton.addEventListener(
      "click",
      closeLightbox
    );

    document.getElementById("prevArtwork")
      .addEventListener("click", () => moveArtwork(-1));

    document.getElementById("nextArtwork")
      .addEventListener("click", () => moveArtwork(1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {
        moveArtwork(-1);
      }

      if (event.key === "ArrowRight") {
        moveArtwork(1);
      }
    });


    /*
      第一次載入
    */
    renderGallery();
  </script>
